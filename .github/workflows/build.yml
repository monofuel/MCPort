name: Build
on:
  push:
    branches: [master]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: treeform/setup-nim-action@v6
      - name: Native libraries
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev
      - name: Resolve locked dependencies with nimby
        run: |
          nimby --version
          task_project_dir="$PWD"
          cd ..
          nimby create
          cd "$task_project_dir"
          nimby sync -g nimby.lock
      - run: make check
      - run: make test
